# Prints the live menu to public/menu/menu.pdf and commits it; Cloudflare then redeploys the site.

# Runs when the admin panel's "Update the PDF" button is pressed, from the Actions tab
# ("Run workflow"), and every night after the database's daily limits reset (00:20 UTC).
# It only commits when the menu changed since the last export.
name: Menu PDF

on:
  workflow_dispatch:
    inputs:
      force:
        description: Export even if the menu has not changed
        type: boolean
        default: false
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write

concurrency:
  group: menu-pdf
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" \
            --no-audit --no-fund playwright@1.56.1

      - name: Install Chromium and dependencies
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Chromium installation failed after 3 attempts."
              exit 1
            fi

            echo "Installation failed. Retrying in 10 seconds..."
            sleep 10
          done

      - name: Verify Chromium
        shell: bash
        run: |
          node -e "
            const { chromium } = require(
              process.env.RUNNER_TEMP + '/pw/node_modules/playwright'
            );
            (async () => {
              const browser = await chromium.launch({ headless: true });
              console.log('Chromium launched successfully.');
              await browser.close();
            })().catch(err => {
              console.error(err);
              process.exit(1);
            });
          "

      - name: Export the menu
        run: node tools/export-menu-pdf.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
          SITE_URL: ${{ vars.SITE_URL || 'https://crepebeirut.com' }}
          FORCE: ${{ inputs.force && '1' || '' }}

      - name: Save the new PDF
        shell: bash
        run: |
          set -euo pipefail

          git add public/menu

          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update the menu PDF"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
