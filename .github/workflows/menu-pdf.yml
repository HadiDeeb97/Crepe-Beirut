# Prints the live menu to public/menu/menu.pdf and commits it; Cloudflare then redeploys the site.
# Runs when the admin panel's "Update the PDF" button is pressed, from the Actions tab
# ("Run workflow"), and every night after the database's daily limits reset (00:20 UTC).
# It only commits when the menu changed since the last export.
name: Menu PDF

on:
  workflow_dispatch:
    inputs:
      force:
        description: Export even if the menu has not changed
        type: boolean
        default: false
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write

concurrency:
  group: menu-pdf
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Export the menu
        run: node tools/export-menu-pdf.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
          SITE_URL: ${{ vars.SITE_URL || 'https://crepebeirut.com' }}
          FORCE: ${{ inputs.force && '1' || '' }}

      - name: Save the new PDF
        run: |
          git add public/menu
          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the menu PDF"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
